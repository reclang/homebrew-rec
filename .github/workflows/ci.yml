# Every push and pull request installs the formula from source on macOS and
# Linux, runs its test block and audits it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      # checks this repository out into Homebrew's tap directory
      - uses: Homebrew/actions/setup-homebrew@master
      - run: brew tap-info reclang/rec
      # fully qualified, so the formula is trusted without `brew trust`
      - run: brew install --verbose reclang/rec/reclang
      - run: brew test --verbose reclang/rec/reclang
      - run: brew audit --strict --online reclang/rec/reclang
      - run: brew style reclang/rec
