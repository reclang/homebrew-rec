# brew tap-new --github-packages template (Homebrew 7.0.6): brew pr-pull
# uploads a pull request's bottles to GitHub Packages, adds the bottle block
# and pushes the result to main. It runs by itself once brew test-bot passes
# on a release pull request, a reclang-X.Y.Z branch of this repository, and
# by hand with the pull request number.
name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]

permissions: {}

# runs for the same pull request wait for each other; other test-bot runs
# get a group of their own
concurrency:
  group: pr-pull-${{ inputs.pull_request || github.event.workflow_run.pull_requests[0].number || github.run_id }}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  # the pull request to publish: the dispatch inputs, or the release pull
  # request test-bot has just passed; branches from forks never publish
  pull-request:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'reclang-'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.find.outputs.number }}
      head_sha: ${{ steps.find.outputs.head_sha }}
    steps:
      - name: Find the pull request
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ inputs.pull_request || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
        run: |
          if [[ -z "$PULL_REQUEST" ]]
          then
            echo "::error::no pull request for this run"
            exit 1
          fi
          # a re-run or a duplicate event finds the pull request published
          state=$(gh pr view "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [[ "$state" != OPEN ]]
          then
            echo "::notice::pull request #$PULL_REQUEST is $state, nothing to publish"
            exit 0
          fi
          echo "number=$PULL_REQUEST" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  pr-pull:
    needs: pull-request
    if: needs.pull-request.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      packages: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1

      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ needs.pull-request.outputs.head_sha }}
          PULL_REQUEST: ${{ needs.pull-request.outputs.number }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" \
              "$PULL_REQUEST"
          else
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          branch: main
